<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@500&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1128px;height:191px;overflow:hidden;background:#0E0B1F}
.b{position:relative;width:1128px;height:191px;overflow:hidden;background:#0E0B1F}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:radial-gradient(ellipse 60% 120% at 62% 50%,#000 30%,transparent 100%)}
.g1{position:absolute;width:420px;height:420px;border-radius:50%;background:#F65663;filter:blur(110px);opacity:.38;left:520px;top:40px}
.g2{position:absolute;width:520px;height:520px;border-radius:50%;background:#9452F2;filter:blur(120px);opacity:.45;left:760px;top:-120px}
.copy{position:absolute;left:172px;top:50%;transform:translateY(-50%)}
.eyebrow{font:500 10px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:8px}
.eyebrow i{display:block;width:18px;height:1px;background:linear-gradient(90deg,#F65663,#9452F2)}
h1{margin-top:8px;font:700 34px/1.02 'Sora',sans-serif;letter-spacing:-1.6px;color:#fff;white-space:nowrap}
h1 span{background:linear-gradient(90deg,#F65663,#B07CFF);-webkit-background-clip:text;color:transparent}
p{margin-top:9px;font:500 13px 'DM Sans',sans-serif;color:rgba(255,255,255,.72)}
.team{position:absolute;right:22px;bottom:0;height:191px;display:flex;align-items:flex-end}
.team img{display:block;margin-left:-62px;position:relative;filter:drop-shadow(0 6px 18px rgba(14,11,31,.55))}
.team img:first-child{margin-left:0}
.team img.s{height:128px;z-index:1}.team img.m{height:150px;z-index:2}.team img.l{height:176px;z-index:3}
</style></head><body><div class="b">
<div class="grid"></div><div class="g1"></div><div class="g2"></div>
<div class="copy">
 <div class="eyebrow"><i></i>unhired.io</div>
 <h1>The <span>AI Employee</span> Company</h1>
 <p>AI Employees, built, trained and maintained for growing businesses.</p>
</div>
<div class="team">
 <img class="s" src="avatars/ai-bookkeeper.png">
 <img class="m" src="avatars/ai-executive-assistant.png">
 <img class="l" src="avatars/ai-receptionist.png">
 <img class="m" src="avatars/ai-sales-rep.png">
 <img class="s" src="avatars/ai-customer-support.png">
</div>
</div></body></html>
