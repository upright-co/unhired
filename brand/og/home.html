<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=DM+Sans:wght@500&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
.b{position:relative;width:1200px;height:630px;overflow:hidden;background:#09070F;color:#fff}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.045) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse 70% 80% at 60% 70%,#000 20%,transparent 100%)}
.g1{position:absolute;width:560px;height:560px;border-radius:50%;background:#F65663;filter:blur(150px);opacity:.35;left:160px;top:330px}
.g2{position:absolute;width:620px;height:620px;border-radius:50%;background:#9452F2;filter:blur(160px);opacity:.5;left:620px;top:120px}
.logo{position:absolute;left:72px;top:60px;height:46px}
.copy{position:absolute;left:72px;top:150px}
h1{font:700 70px/1.02 'Sora',sans-serif;letter-spacing:-2.8px}
h1 span{background:linear-gradient(90deg,#F65663,#B07CFF);-webkit-background-clip:text;color:transparent}
p{margin-top:18px;font:500 26px 'DM Sans',sans-serif;color:rgba(255,255,255,.75)}
.team{position:absolute;left:50%;transform:translateX(-50%);bottom:0;display:flex;align-items:flex-end}
.team img{display:block;margin-left:-70px;position:relative;filter:drop-shadow(0 8px 24px rgba(9,7,15,.6))}
.team img:first-child{margin-left:0}
.s{height:220px;z-index:1}.m{height:250px;z-index:2}.l{height:285px;z-index:3}
</style></head><body><div class="b">
<div class="grid"></div><div class="g1"></div><div class="g2"></div>
<img class="logo" src="logo-ondark.png" alt="">
<div class="copy"><h1>The <span>AI Employee</span> Company</h1><p>Before you post the job, see if an AI Employee can do it.</p></div>
<div class="team">
 <img class="s" src="../avatars/ai-bookkeeper.png"><img class="m" src="../avatars/ai-executive-assistant.png"><img class="l" src="../avatars/ai-receptionist.png"><img class="m" src="../avatars/ai-sales-rep.png"><img class="s" src="../avatars/ai-customer-support.png">
</div>
</div></body></html>
