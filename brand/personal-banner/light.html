<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1584px;height:396px;overflow:hidden}
.b{position:relative;width:1584px;height:396px;overflow:hidden;background:#F7F6FB}
svg.waves{position:absolute;inset:0}
.grain{position:absolute;inset:0;opacity:.10;mix-blend-mode:multiply}
.brand{position:absolute;right:84px;top:50%;transform:translateY(-38%);text-align:right}
.brand img{height:84px;display:block;margin-left:auto}
.brand p{margin-top:14px;font:500 17px 'DM Sans',sans-serif;letter-spacing:.01em;color:#4A4560}
</style></head><body><div class="b">
<svg class="waves" viewBox="0 0 1584 396" preserveAspectRatio="none">
 <defs>
  <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
  <linearGradient id="hi" x1="0" x2="1"><stop offset="0" stop-color="#F65663" stop-opacity=".35"/><stop offset="1" stop-color="#9452F2" stop-opacity=".35"/></linearGradient>
  <linearGradient id="lo" x1="0" x2="1"><stop offset="0" stop-color="#F65663" stop-opacity=".22"/><stop offset="1" stop-color="#9452F2" stop-opacity=".28"/></linearGradient>
 </defs>
 <g filter="url(#blur)">
  <path d="M-100 150 C 200 40, 420 260, 720 150 S 1200 30, 1700 170 L1700 230 C 1250 110, 1000 300, 720 230 S 200 140,-100 250 Z" fill="url(#hi)"/>
  <path d="M-100 330 C 260 230, 520 420, 860 320 S 1350 210, 1700 300 L1700 500 L-100 500 Z" fill="url(#lo)"/>
  <path d="M-100 -60 C 300 60, 650 -40, 1000 40 S 1450 80, 1700 0 L1700 -120 L-100 -120 Z" fill="url(#lo)" opacity=".7"/>
 </g>
</svg>
<svg class="grain" viewBox="0 0 1584 396"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="brand"><img src="logo-color.png" alt=""><p>The AI Employee Company</p></div>
</div></body></html>
