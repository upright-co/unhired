<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1584px;height:396px;overflow:hidden}
.b{position:relative;width:1584px;height:396px;overflow:hidden;background:#09070F}
svg.waves{position:absolute;inset:0}
.grain{position:absolute;inset:0;opacity:.13;mix-blend-mode:screen}
.brand{position:absolute;right:84px;top:50%;transform:translateY(-38%);text-align:right}
.brand img{height:88px;display:block;margin-left:auto}
.brand p{margin-top:14px;font:500 21px 'DM Sans',sans-serif;letter-spacing:.01em;color:rgba(255,255,255,.78)}
</style></head><body><div class="b">
<svg class="waves" viewBox="0 0 1584 396">
 <defs>
  <filter id="soft" filterUnits="userSpaceOnUse" x="-300" y="-400" width="2200" height="1200"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-300" y="-400" width="2200" height="1200"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F65663"/><stop offset=".55" stop-color="#C452B8"/><stop offset="1" stop-color="#9452F2"/></linearGradient>
  <linearGradient id="lineFade" gradientUnits="userSpaceOnUse" x1="0" x2="1584"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".15" stop-color="#fff" stop-opacity=".45"/><stop offset=".58" stop-color="#fff" stop-opacity=".35"/><stop offset=".72" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="lineGlow" gradientUnits="userSpaceOnUse" x1="0" x2="1584"><stop offset="0" stop-color="#F65663" stop-opacity="0"/><stop offset=".15" stop-color="#F65663"/><stop offset=".5" stop-color="#C452B8"/><stop offset=".72" stop-color="#9452F2" stop-opacity="0"/></linearGradient>
  <radialGradient id="fade" cx=".55" cy=".5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1584" height="396"><rect width="1584" height="396" fill="url(#fade)"/></mask>
 </defs>
 <g mask="url(#m)">
  <path d="M-50 300 C 250 190, 480 390, 800 280 S 1250 220, 1650 320 L1650 420 C 1300 330, 1080 420, 800 380 S 260 300,-50 420 Z" fill="url(#g)" opacity=".6" filter="url(#soft)"/>
  <path d="M-50 120 C 300 230, 560 40, 900 130 S 1380 230, 1650 110" fill="none" stroke="url(#g)" stroke-width="70" opacity=".22" filter="url(#soft)"/>
  <path d="M-50 300 C 250 200, 480 380, 800 282 S 1250 230, 1650 330" fill="none" stroke="url(#lineGlow)" stroke-width="2.5" opacity=".8" filter="url(#glow)"/>
  <path d="M-50 300 C 250 200, 480 380, 800 282 S 1250 230, 1650 330" fill="none" stroke="url(#lineFade)" stroke-width="1.2"/>
 </g>
</svg>
<svg class="grain" viewBox="0 0 1584 396"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="brand"><img src="logo-ondark.png" alt=""><p>The AI Employee Company</p></div>
</div></body></html>
