<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@500;600&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:627px;overflow:hidden}
.b{position:relative;width:1200px;height:627px;overflow:hidden;background:#09070F;color:#fff}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.045) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse 70% 80% at 70% 50%,#000 20%,transparent 100%)}
.g1{position:absolute;width:520px;height:520px;border-radius:50%;background:#F65663;filter:blur(140px);opacity:.35;left:560px;top:220px}
.g2{position:absolute;width:560px;height:560px;border-radius:50%;background:#9452F2;filter:blur(150px);opacity:.5;left:760px;top:-140px}
.logo{position:absolute;left:72px;top:64px;height:44px}
.copy{position:absolute;left:72px;top:160px;width:540px}
.eyebrow{font:500 17px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65);display:flex;align-items:center;gap:12px}
.eyebrow i{display:block;width:28px;height:2px;background:linear-gradient(90deg,#F65663,#9452F2)}
h1{margin-top:20px;font:700 56px/1.04 'Sora',sans-serif;letter-spacing:-2.2px}
h1 span{background:linear-gradient(90deg,#F65663,#B07CFF);-webkit-background-clip:text;color:transparent}
.cta{margin-top:36px;display:inline-flex;align-items:center;gap:12px;padding:18px 30px;border-radius:999px;background:linear-gradient(90deg,#F65663,#9452F2);font:600 22px 'DM Sans',sans-serif;box-shadow:0 14px 40px -10px rgba(246,86,99,.6),0 14px 50px -12px rgba(148,82,242,.7)}
.avatar{position:absolute;right:-6px;bottom:0;height:430px;filter:drop-shadow(0 10px 40px rgba(14,11,31,.6))}
.card{position:absolute;left:640px;top:64px;width:330px;padding:22px 24px;border-radius:24px;background:rgba(20,15,36,.82);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px -20px rgba(0,0,0,.6);z-index:2}
.card h3{font:500 13px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font:500 18px 'DM Sans',sans-serif}
.tag{font:600 13px 'DM Sans',sans-serif;padding:5px 11px;border-radius:999px;white-space:nowrap}
.ai{background:rgba(34,197,94,.18);color:#6EE7A0;border:1px solid rgba(110,231,160,.35)}
.chk{background:rgba(250,204,21,.15);color:#FDE68A;border:1px solid rgba(253,230,138,.35)}
.you{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.25)}
</style></head><body><div class="b">
<div class="grid"></div><div class="g1"></div><div class="g2"></div>
<img class="logo" src="logo-ondark.png" alt="">
<div class="copy">
 <div class="eyebrow"><i></i>Free · About 3 minutes</div>
 <h1>Can an <span>AI Employee</span> do the job you're hiring for?</h1>
 <div class="cta">Take the AI Employee Assessment →</div>
</div>
<div class="card">
 <h3>Your role, task by task</h3>
 <div class="row">Answer every call<span class="tag ai">AI Employee</span></div>
 <div class="row">Book appointments<span class="tag ai">AI Employee</span></div>
 <div class="row">Refund requests<span class="tag chk">Human check</span></div>
 <div class="row">Big custom quotes<span class="tag you">Your team</span></div>
</div>
<img class="avatar" src="../avatars/ai-receptionist.png" alt="">
</div></body></html>
