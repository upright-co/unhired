<!doctype html><html><head><meta charset="utf-8">
<title>Managing an AI Employee: the hours</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet">
<!-- Animated LinkedIn post, 1080x1350 (4:5), seamless loop of DURATION seconds.
     Big-number counter with a bar race: the manager's hours each week for the first 12 weeks.
     scripts/render-animation.mjs calls window.render(t) frame by frame (?capture). render(t) is pure. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#09070F}
.b{position:relative;width:1080px;height:1350px;overflow:hidden;background:#09070F;color:#fff;font-family:'DM Sans',sans-serif}
.band{position:absolute;left:-200px;right:-200px;top:300px;height:330px;transform:rotate(-9deg);background:linear-gradient(90deg,rgba(246,86,99,.55),rgba(148,82,242,.7));filter:blur(2px);opacity:.28}
.band2{position:absolute;left:-200px;right:-200px;top:330px;height:4px;transform:rotate(-9deg);background:linear-gradient(90deg,#F65663,#B07CFF);opacity:.5}
.head{position:absolute;left:56px;right:56px;top:48px;display:flex;align-items:center;justify-content:space-between}
.head img{height:24px;opacity:.7;display:block}
.tag{font:600 15px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#C6A2FF;border:1.5px solid rgba(176,124,255,.55);border-radius:999px;padding:10px 20px}
h1{position:absolute;left:56px;right:56px;top:118px;font:700 70px/1.04 'Sora',sans-serif;letter-spacing:-2.8px}
h1 span{background:linear-gradient(90deg,#F65663,#B07CFF);-webkit-background-clip:text;color:transparent}

.hero{position:absolute;left:56px;right:56px;top:300px;height:250px;display:flex;align-items:flex-end;justify-content:space-between}
.big{font:700 230px/0.82 'JetBrains Mono',monospace;letter-spacing:-12px;color:#fff}
.big small{font:600 70px 'JetBrains Mono',monospace;letter-spacing:0;color:#FF8A94;margin-left:14px}
.hl{margin-top:18px;font:500 24px 'DM Sans';color:rgba(255,255,255,.78)}
.side{text-align:right;padding-bottom:30px}
.wk{font:700 22px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#fff;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:12px;padding:12px 18px;display:inline-block}
.wk2{margin-top:14px;font:500 18px 'JetBrains Mono',monospace;color:rgba(255,255,255,.55);letter-spacing:.06em}

.chart{position:absolute;left:56px;right:56px;top:640px;height:400px}
.axis{position:absolute;left:0;right:0;bottom:44px;height:2px;background:rgba(255,255,255,.18)}
.gl{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.07)}
.gl span{position:absolute;right:0;top:-22px;font:500 14px 'JetBrains Mono',monospace;color:rgba(255,255,255,.4)}
.bar{position:absolute;bottom:46px;width:58px;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#F65663,#9452F2);transform-origin:bottom}
.bar .v{position:absolute;left:-10px;right:-10px;top:-30px;text-align:center;font:600 16px 'JetBrains Mono',monospace;color:#fff}
.wl{position:absolute;bottom:8px;width:58px;text-align:center;font:500 15px 'JetBrains Mono',monospace;color:rgba(255,255,255,.4)}
.ph{position:absolute;top:0;height:30px;border-top:2px solid rgba(255,255,255,.25);font:600 13px 'JetBrains Mono',monospace;letter-spacing:.12em;color:rgba(255,255,255,.5);padding-top:8px;white-space:nowrap}

.card{position:absolute;left:56px;right:56px;top:1074px;height:176px;border-radius:24px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);padding:26px 32px;overflow:hidden}
.card .k{font:600 14px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#FF8A94}
.card .t{margin-top:10px;font:700 38px/1.1 'Sora';letter-spacing:-1.2px}
.card .d{margin-top:10px;font:400 22px/1.35 'DM Sans';color:rgba(255,255,255,.72)}
.card .in{position:absolute;left:32px;right:32px;top:26px}
.foot{position:absolute;left:56px;right:56px;bottom:34px;font:500 16px 'DM Sans';color:rgba(255,255,255,.45)}
</style></head><body><div class="b">
<div class="band"></div>
<div class="head"><img src="../facebook/logo-ondark.png" alt="Unhired"><div class="tag">THE FIRST 12 WEEKS</div></div>
<h1>How much managing an<br><span>AI Employee takes</span></h1>

<div class="hero">
 <div><div class="big"><span id="num">0.0</span><small>h</small></div><div class="hl">of the manager's time this week</div></div>
 <div class="side"><div class="wk" id="wk">WEEK 01</div><div class="wk2" id="wk2">1 to 2 hours a day</div></div>
</div>

<div class="chart" id="chart"><div class="axis"></div></div>

<div class="card" id="card"></div>
<div class="foot">Estimates from Brandon Upright's own work setting up AI Employees</div>
</div>

<script>
window.DURATION=20;
const T=window.DURATION, START=1.0, STEP=1.2, GROW=.7;
const PHASES=[
 {from:0,to:1,k:'WEEKS 1 AND 2',rate:'1 to 2 hours a day',t:'Approve almost everything',d:'Read the whole log and write down the rules nobody wrote down.'},
 {from:2,to:7,k:'WEEK 3 TO MONTH 2',rate:'About 30 minutes a day',t:'Sample the log, shrink the list',d:'Move duties off the asks-first list once the log shows a clean run.'},
 {from:8,to:11,k:'MONTH 3 AND AFTER',rate:'1 to 2 hours a week',t:'One weekly review',d:'A standing Friday block, plus the approvals that always stay with a person.'},
];
const HOURS=[7.5,7.5,2.5,2.5,2.5,2.5,2.5,2.5,1.5,1.5,1.5,1.5];
const MAXH=8, CH=400-46-40; // usable bar height
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const W=968, BW=58, GAP=(W-12*BW)/11;
const xAt=i=>i*(BW+GAP);
const phaseOf=i=>PHASES.findIndex(p=>i>=p.from&&i<=p.to);

// build chart
[2,4,6,8].forEach(h=>{const g=document.createElement('div');g.className='gl';g.style.bottom=(46+CH*h/MAXH)+'px';$('chart').appendChild(g)});
PHASES.forEach((p,j)=>{const d=document.createElement('div');d.className='ph';d.id='ph'+j;d.style.left=xAt(p.from)+'px';d.style.width=(xAt(p.to)+BW-xAt(p.from))+'px';d.textContent=j===0?'WEEKS 1-2':(j===1?'WEEKS 3-8':'WEEK 9 ON');$('chart').appendChild(d)});
HOURS.forEach((h,i)=>{
 const b=document.createElement('div');b.className='bar';b.id='b'+i;b.style.left=xAt(i)+'px';b.style.height=(CH*h/MAXH)+'px';b.innerHTML=`<div class="v">${h}</div>`;$('chart').appendChild(b);
 const l=document.createElement('div');l.className='wl';l.id='l'+i;l.style.left=xAt(i)+'px';l.textContent='W'+(i+1);$('chart').appendChild(l);
});
PHASES.forEach((p,j)=>{const d=document.createElement('div');d.className='in';d.id='in'+j;d.innerHTML=`<div class="k">${p.k} · ${p.rate.toUpperCase()}</div><div class="t">${p.t}</div><div class="d">${p.d}</div>`;$('card').appendChild(d)});

window.render=function(tt){
 let t=((tt%T)+T)%T;
 let op=1;
 if(t>=18.6&&t<19.2) op=1-ease((t-18.6)/.6);
 if(t>=19.2){op=ease(clamp((t-19.2)/.6));t=0;}
 ['chart','card'].forEach(id=>$(id).style.opacity=op);
 $('num').parentNode.parentNode.parentNode.style.opacity=op;

 // current week index (-1 before first bar)
 let cur=-1;
 HOURS.forEach((h,i)=>{
  const s=START+i*STEP, k=ease(clamp((t-s)/GROW));
  if(t>=s) cur=i;
  const b=$('b'+i);
  b.style.transform=`scaleY(${k})`;
  b.querySelector('.v').style.opacity=clamp((t-s-GROW*.6)/.3);
  const active=t>=s&&t<s+STEP;
  b.style.boxShadow=active?`0 0 ${30+10*Math.sin(t*6)}px rgba(246,86,99,.55)`:'none';
  b.style.opacity=t>=s?(active?1:.78):0;
  $('l'+i).style.color=active?'#fff':(t>=s?'rgba(255,255,255,.6)':'rgba(255,255,255,.3)');
 });

 // hero number counts between the previous and current week
 let val=0;
 if(cur>=0){const prev=cur>0?HOURS[cur-1]:0,k=ease(clamp((t-(START+cur*STEP))/GROW));val=prev+(HOURS[cur]-prev)*k;}
 $('num').textContent=val.toFixed(1);
 const w=Math.max(cur,0)+1;
 $('wk').textContent='WEEK '+String(w).padStart(2,'0');
 const pj=cur<0?0:phaseOf(cur);
 $('wk2').textContent=PHASES[pj].rate;

 // phase labels
 PHASES.forEach((p,j)=>{const on=j===pj&&cur>=0, past=cur>p.to;const el=$('ph'+j);
  el.style.color=on?'#FF8A94':(past?'rgba(255,255,255,.6)':'rgba(255,255,255,.35)');
  el.style.borderTopColor=on?'#F65663':(past?'rgba(255,255,255,.4)':'rgba(255,255,255,.18)');});

 // card cross-fades between phases
 PHASES.forEach((p,j)=>{const s=START+p.from*STEP, e=START+(p.to+1)*STEP;
  let k;
  if(j===PHASES.length-1) k=clamp((t-s)/.4);
  else if(j===0) k=t<e?1:1-clamp((t-e)/.4);
  else k=Math.min(clamp((t-s)/.4),1-clamp((t-e)/.4));
  const el=$('in'+j);el.style.opacity=k;el.style.transform=`translateY(${(1-k)*14}px)`;});
};

window.ready=document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))));
if(!location.search.includes('capture')){const t0=performance.now();window.ready.then(()=>{const loop=()=>{render((performance.now()-t0)/1000);requestAnimationFrame(loop)};loop();});}
else render(0);
</script>
</body></html>
