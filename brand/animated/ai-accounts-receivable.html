<!doctype html><html><head><meta charset="utf-8">
<title>AI Accounts Receivable Reminder Ladder</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet">
<!-- Animated social post, 1080x1350 (4:5), seamless loop of DURATION seconds.
     Look: step ladder climbing bottom-left to top-right, ink with one big coral/violet duotone circle,
     counting mono number as the hero. scripts/render-animation.mjs renders it to MP4. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#09070F}
.b{position:relative;width:1080px;height:1350px;overflow:hidden;background:#09070F;color:#fff;font-family:'DM Sans',sans-serif}
.disc{position:absolute;left:730px;top:-70px;width:640px;height:640px;border-radius:50%;background:linear-gradient(160deg,#F65663 10%,#9452F2 78%)}
.head{position:absolute;left:44px;top:44px}
.head img{height:24px;opacity:.7;display:block}
h1{position:absolute;left:44px;top:112px;font:700 60px/1.04 'Sora',sans-serif;letter-spacing:-2.4px}
.stage{position:absolute;inset:0}
.who{position:absolute;left:760px;top:150px;width:300px;text-align:center}
.who .l{font:600 14px 'JetBrains Mono',monospace;letter-spacing:.18em;color:rgba(255,255,255,.8)}
.who .n{margin-top:10px;font:700 40px/1.05 'Sora';letter-spacing:-1.4px}
.who .s{margin-top:12px;font:500 18px/1.3 'DM Sans';color:rgba(255,255,255,.9)}
.hero{position:absolute;left:44px;top:268px}
.hero .lbl{font:600 17px 'JetBrains Mono',monospace;letter-spacing:.18em;color:#FF8A94}
.hero .num{margin-top:2px;font:600 190px/1 'JetBrains Mono',monospace;letter-spacing:-10px;margin-left:-8px}
.hero .status{margin-top:8px;display:flex;align-items:center;gap:12px;font:500 22px 'DM Sans';color:rgba(255,255,255,.85);white-space:nowrap}
.hero .status i{width:11px;height:11px;border-radius:50%;background:#FF8A94;flex:none}
.step{position:absolute;height:118px;right:44px}
.step .ghost{position:absolute;inset:0;border-radius:20px;border:1.5px dashed rgba(255,255,255,.16)}
.step .card{position:absolute;inset:0;border-radius:20px;background:#17111F;border:1.5px solid rgba(246,86,99,.6);padding:17px 24px;transform-origin:left center}
.step.person .card{background:#1D1330;border-color:#B07CFF}
.step .when{font:600 16px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#FF8A94}
.step.person .when{color:#C9A6FF}
.step .what{margin-top:12px;font:600 30px/1.2 'Sora';letter-spacing:-.6px;white-space:nowrap}
.step .by{position:absolute;right:20px;top:15px;font:600 12px 'JetBrains Mono',monospace;letter-spacing:.12em;padding:5px 10px;border-radius:8px;border:1.2px solid rgba(246,86,99,.6);color:#FF8A94}
.step.person .by{border-color:#B07CFF;color:#fff;background:rgba(148,82,242,.45)}
.riser{position:absolute;width:2px;background:linear-gradient(180deg,#9452F2,#F65663)}
.foot{position:absolute;left:44px;right:44px;bottom:34px;display:flex;justify-content:space-between;align-items:center;font:500 17px 'DM Sans';color:rgba(255,255,255,.55)}
.foot .mono{font:500 16px 'JetBrains Mono',monospace;letter-spacing:.08em;color:rgba(255,255,255,.7)}
</style></head><body><div class="b">
<div class="disc" id="disc"></div>
<div class="head"><img src="../facebook/logo-ondark.png" alt="Unhired"></div>
<h1>One invoice,<br>five reminders</h1>
<div class="stage" id="stage">
 <div class="who"><div class="l">SENT BY</div><div class="n" id="whoN">AI Employee</div><div class="s" id="whoS">accounts receivable</div></div>
 <div class="hero"><div class="lbl" id="lbl">DAYS BEFORE DUE</div><div class="num" id="num">5</div><div class="status"><i id="dot"></i><span id="status">Invoice sent</span></div></div>
 <div id="steps"></div>
</div>
<div class="foot"><span>Example schedule. Every business sets its own timing.</span><span class="mono">unhired.io</span></div>
</div>

<script>
window.DURATION=18;
const ST=[
 {day:-5,when:'5 DAYS BEFORE DUE',what:'A short note with a payment link'},
 {day:3,when:'3 DAYS LATE',what:'Checks it reached the right person'},
 {day:15,when:'15 DAYS LATE',what:'A firmer note, asks for a date'},
 {day:30,when:'30 DAYS LATE',what:'Statement of every open invoice'},
 {day:45,when:'45 DAYS LATE',what:'Reminders stop. A person calls.',person:true},
];
const T=window.DURATION, START=.7, STEP=3.05, CHECK=1.1;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const TOP=i=>1092-i*130, LEFT=i=>44+i*58;
ST.forEach((s,i)=>{
 const el=document.createElement('div');el.className='step'+(s.person?' person':'');el.id='s'+i;
 el.style.top=TOP(i)+'px';el.style.left=LEFT(i)+'px';
 el.innerHTML=`<div class="ghost"></div><div class="card"><div class="when">${s.when}</div><div class="what">${s.what}</div><div class="by">${s.person?'A PERSON':'AI EMPLOYEE'}</div></div>`;
 $('steps').appendChild(el);
 if(i>0){const r=document.createElement('div');r.className='riser';r.id='r'+i;r.style.left=(LEFT(i)-30)+'px';r.style.top=(TOP(i)+59)+'px';$('steps').appendChild(r);}
});

window.render=function(tt){
 let t=((tt%T)+T)%T, op=1;
 const fo=T-1.2;
 if(t>=fo&&t<fo+.5)op=1-ease((t-fo)/.5);
 if(t>=fo+.5){op=ease(clamp((t-fo-.5)/.5));t=0;}
 $('stage').style.opacity=op;

 let cur=-1;ST.forEach((s,i)=>{if(t>=START+i*STEP)cur=i;});
 const lt=cur>=0?t-(START+cur*STEP):0;          // time inside the current step
 const checking=cur>=0&&lt<CHECK;

 // hero number counts toward the current step's day while the bank feed is checked
 let day=-9;
 if(cur>=0){const from=cur>0?ST[cur-1].day:-9;day=from+(ST[cur].day-from)*ease(clamp(lt/CHECK));}
 const d=Math.round(day);
 $('num').textContent=Math.abs(d);
 $('lbl').textContent=d<0?'DAYS BEFORE DUE':(d===0?'DUE TODAY':'DAYS LATE');
 const person=cur>=0&&ST[cur].person&&!checking;
 $('lbl').style.color=person?'#C9A6FF':'#FF8A94';
 $('status').textContent=cur<0?'Invoice sent':(checking?'Checking the bank feed first':(ST[cur].person?'Still unpaid. Handed over with the history.':'Not paid yet. Reminder sent.'));
 $('dot').style.background=person?'#B07CFF':'#FF8A94';
 $('dot').style.opacity=checking?(Math.floor(t*5)%2?.25:1):1;

 // who sends it (on the disc)
 const pk=cur===ST.length-1?ease(clamp((lt-CHECK)/.4)):0;
 $('whoN').textContent=pk>.5?'A person':'AI Employee';
 $('whoS').textContent=pk>.5?'the account owner':'accounts receivable';
 $('whoN').style.opacity=$('whoS').style.opacity=Math.abs(pk-.5)*2;
 $('disc').style.transform=`scale(${1+.012*Math.sin(t/T*Math.PI*2)})`;

 // steps pop in from the bottom of the ladder up
 ST.forEach((s,i)=>{
  const a=t-(START+i*STEP)-CHECK, k=clamp(a/.45), el=$('s'+i), card=el.querySelector('.card');
  card.style.opacity=clamp(a/.2);
  card.style.transform=`translateX(${-40*(1-ease(k))}px) scale(${.94+.06*back(k)})`;
  const glow=i===cur&&a>0?Math.max(0,1-a/1.4):0, c=s.person?'176,124,255':'246,86,99';
  card.style.boxShadow=`0 0 ${50*glow}px rgba(${c},${.55*glow})`;
  el.querySelector('.ghost').style.opacity=1-clamp(a/.2);
  if(i>0){const r=$('r'+i), g=ease(clamp((t-(START+i*STEP))/CHECK));r.style.height=(71*g)+'px';r.style.opacity=g>0?1:0;}
 });
};

window.ready=document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))));
if(!location.search.includes('capture')){const t0=performance.now();window.ready.then(()=>{const loop=()=>{render((performance.now()-t0)/1000);requestAnimationFrame(loop)};loop();});}
else render(0);
</script>
</body></html>
